<html>

  <head>
    <meta charset="utf-8">
    <title>Heatmaps</title>

    <script src="https://cdn.jsdelivr.net/npm/deck.gl@9.0.0/dist.min.js"></script>
    <script src="javascript.js"></script>
    <link rel="stylesheet" href="./style.css">
  </head>

  <body>
    <div id="map"></div>

    <div id="floating-panel">
      <button id="toggle-heatmap">Toggle Heatmap</button>
      <button id="change-gradient">Change gradient</button>
      <button id="change-opacity">Change opacity</button>
      <button id="change-radius">Change radius</button>
      <button id="load-counter">Count Boundary</button>
    </div>

    <div id="counts">
      <h2>Members within boundary: <span id="countInside"></span>%</h2>
      <h2>Members outside boundary: <span id="countOutside"></span>%</h2>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB2V3C53279a8r8b63kkp28AB3NQ-urr-U&callback=initMap&libraries=geometry&v=weekly" async defer></script>
  </body>

</html>
